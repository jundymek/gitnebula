      disposition: needs-human
      reason: not-safely-automatable
      guidance: "Requires reading scrollHeight against clientHeight and the geometry of associated controls, none of which is an assertable target on the declared surfaces. For each of #panel, #start-here and .p-blast-list, populate the region past its visual cap and assert that the region ITSELF is the scroll container (scrollHeight exceeds clientHeight on that element, not on an ancestor), and that no control associated with the region has a bounding box extending outside the browser window."
