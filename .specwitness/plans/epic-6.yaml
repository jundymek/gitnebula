    - criterionId: E6-05
      disposition: needs-human
      reason: not-safely-automatable
      guidance: "This is a claim about a machine, not about a file, and no declared surface may uninstall or hide a browser. The static precondition is checked by E6-04 (no Playwright anywhere in the `pnpm test` script graph); that is necessary, not sufficient. Verify it properly in a clean environment - a container, or a checkout with PLAYWRIGHT_BROWSERS_PATH pointed at an empty directory and no browsers downloaded - that `pnpm install --frozen-lockfile && pnpm test` exits 0. Watch for any attempted browser download or launch in the output: the default path must never reach one. Record the environment used as the evidence."
