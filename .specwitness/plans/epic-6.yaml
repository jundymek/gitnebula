                source: jsonPath
                path: $.expectCalls
                phase: snapshot
              comparison: greaterThan
              expected: "0"
            - description: every assertion in the UI suite supplies a prose failure message
              target:
                source: jsonPath
                path: $.expectsWithoutMessage
                phase: snapshot
              comparison: equals
              expected: "0"
    - criterionId: E6-10
      disposition: automated
      probes:
        - id: production-boot-settles-in-real-browser
          surface: browser
          mechanics:
            serviceId: viewer
            path: /
            scenario: |-
              waitFor "#view-switch"
              waitFor ".legend"
          assertions:
            - description: the production boot path built the chrome in a real browser, so boot() ran rather than throwing
              target:
                source: visible
                selector: "#view-switch"
              comparison: equals
              expected: "true"
            - description: "the engine reached a rendered, settled state: the legend built from the loaded document is on screen"
              target:
                source: visible
                selector: .legend
              comparison: equals
              expected: "true"
            - description: the layer filter is mounted, so the boot completed past chrome assembly rather than stalling part way
              target:
                source: visible
                selector: "#layer-filter"
              comparison: equals
              expected: "true"
            - description: no loader error screen replaced the viewer, so the boot path resolved rather than failed
              target:
                source: visible
                selector: .error-screen
              comparison: equals
              expected: "false"
        - id: ui-suite-has-browser-specs
          surface: observation
          mechanics:
            commandId: ui-source-census
            args: []
          assertions:
            - description: the UI suite exists
              target:
                source: jsonPath
