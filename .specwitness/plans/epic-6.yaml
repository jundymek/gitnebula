              target:
                source: jsonPath
                path: $.present
                phase: snapshot
              comparison: equals
              expected: "true"
            - description: the literal __gitnebula key is spelled nowhere in the UI suite sources
              target:
                source: jsonPath
                path: $.literalHandleKeyCount
                phase: snapshot
              comparison: equals
              expected: "0"
            - description: at least one UI suite source reaches the handle through the HARNESS_HANDLE_KEY constant instead
              target:
                source: jsonPath
                path: $.filesImportingHandleKeyConst
                phase: snapshot
              comparison: greaterThan
