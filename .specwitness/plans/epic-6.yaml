    - criterionId: E6-08
      disposition: needs-human
      reason: not-safely-automatable
      guidance: "A negative control is a check that must FAIL, and no probe can be written whose passing means another check failed - the declared surfaces adjudicate only satisfied expectations. Verify by hand that the UI suite contains an explicit negative control which takes a representative positive assertion, evaluates it against a deliberately incorrect expectation, and asserts that the evaluation is unsatisfied. Then confirm it fails for the right reason: temporarily break the assertion mechanism (or the fixture it reads) and check the control does not still pass by catching any error indiscriminately."
    - criterionId: E6-09
      disposition: automated
      probes:
