    - criterionId: E6-11
      disposition: automated
      probes:
        - id: view-3d-query-boot
          surface: browser
          mechanics:
            serviceId: viewer
            path: /?view=3d
            scenario: waitFor "#view-switch"
          assertions:
            - description: the view switch renders, so the viewer booted rather than showing an error screen
              target:
                source: visible
                selector: "#view-switch"
              comparison: equals
              expected: "true"
            - description: the 3D button is the pressed one, so ?view=3d booted directly into the 3D view
              target:
                source: visible
                selector: "#view-switch button[data-view='3d'][aria-pressed='true']"
              comparison: equals
              expected: "true"
            - description: the 2D button is not pressed, so the 3D entry was not a fallback to the default view
              target:
                source: visible
                selector: "#view-switch button[data-view='2d'][aria-pressed='true']"
              comparison: equals
              expected: "false"
            - description: no loader error screen is shown on the 3D entry path
              target:
                source: visible
                selector: .error-screen
              comparison: equals
              expected: "false"
    - criterionId: E6-12
      disposition: automated
      probes:
        - id: reader-state-survives-view-round-trip
          surface: browser
          mechanics:
            serviceId: viewer
            path: /
            scenario: |-
              waitFor "#layer-filter"
              click "#layer-test"
              waitFor "#layer-test[aria-pressed='false']"
              click "#view-switch button[data-view='3d']"
              waitFor "#view-switch button[data-view='3d'][aria-pressed='true']"
              click "#view-switch button[data-view='2d']"
              waitFor "#view-switch button[data-view='2d'][aria-pressed='true']"
          assertions:
            - description: after 2D to 3D and back the layer filter still has the test layer switched off, so reader state survived both swaps through production capture and restore
              target:
                source: visible
                selector: "#layer-test[aria-pressed='false']"
              comparison: equals
              expected: "true"
            - description: an untouched layer toggle is still on, so the swap restored the recorded filter rather than clearing every layer
              target:
                source: visible
                selector: "#layer-backend[aria-pressed='true']"
              comparison: equals
              expected: "true"
            - description: the round trip ended back in 2D, so both swaps completed
              target:
                source: visible
                selector: "#view-switch button[data-view='2d'][aria-pressed='true']"
              comparison: equals
              expected: "true"
            - description: the viewer survived both swaps without falling back to an error screen
              target:
                source: visible
                selector: .error-screen
              comparison: equals
              expected: "false"
    - criterionId: E6-13
      disposition: needs-human
      reason: not-safely-automatable
      guidance: Deciding this requires reading globalThis[HARNESS_HANDLE_KEY] twice and comparing object identity against a destroyed engine. The browser surface can read only url, title, element text and element visibility, so no probe can express it. In the UI suite, confirm one spec caches the handle BEFORE a swap and demonstrates that the cached handle refers to the destroyed prior engine (a call on it throws, or it reports destroyed state), while a fresh read of globalThis[HARNESS_HANDLE_KEY] after the swap returns the live engine. Both outcomes must be asserted - a spec that only shows the fresh read works does not demonstrate the stale one is dead.
    - criterionId: E6-14
      disposition: automated
      probes:
        - id: pressed-state-follows-built-view
          surface: browser
          mechanics:
            serviceId: viewer
            path: /
            scenario: |-
              waitFor "#view-switch button[data-view='2d'][aria-pressed='true']"
              click "#view-switch button[data-view='3d']"
              waitFor "#view-switch button[data-view='3d'][aria-pressed='true']"
          assertions:
            - description: after a successful swap the 3D button carries the pressed state, so it reflects the view that was actually built
              target:
                source: visible
                selector: "#view-switch button[data-view='3d'][aria-pressed='true']"
              comparison: equals
              expected: "true"
            - description: the 2D button is no longer pressed, so pressed state moved rather than being set on both
              target:
                source: visible
                selector: "#view-switch button[data-view='2d'][aria-pressed='true']"
              comparison: equals
              expected: "false"
            - description: the unavailability readout is empty after a successful build, so the switch is not reporting a view it failed to construct
              target:
                source: text
                selector: "#view-switch-reason"
              comparison: equals
              expected: ""
    - criterionId: E6-15
      disposition: needs-human
      reason: not-safely-automatable
      guidance: Requires forcing the 3D constructor to throw, which no declared surface can arrange against the shipped bundle. In the UI suite (or a jsdom test with an injected failing constructor), confirm that after the throw the viewer is still interactive in 2D - nodes selectable, filters responsive - and that the reason shown to the reader is the constructor's own failure message VERBATIM. The specific defect to look for is a later capability probe overwriting it with a generic WebGL-unavailable verdict, so assert on the exact reason string rather than on the presence of any message.
    - criterionId: E6-16
      disposition: needs-human
      reason: not-safely-automatable
      guidance: "The browser surface's only click verb takes a CSS selector; it cannot click at a computed screen coordinate, and canvas-painted nodes have no selectable element. Verify in the UI suite: compute a node's real screen position from the engine, click at those page coordinates with the header offset in place, and assert getSelected() returns that node's id. Then confirm the test would actually catch the offset bug - check that the expected page coordinate differs from the canvas-relative one by the header height, so a viewer that forgot to subtract the offset would select a different node or none."
    - criterionId: E6-17
      disposition: automated
      probes:
        - id: ui-readme-records-the-five-findings
          surface: observation
          mechanics:
            commandId: docs-presence
            args: []
          assertions:
            - description: the UI suite README exists
              target:
                source: jsonPath
                path: $.uiReadmePresent
                phase: snapshot
              comparison: equals
              expected: "true"
            - description: it addresses boot() and its prior absence of test execution
              target:
                source: jsonPath
                path: $.uiReadmeMentionsBootGap
                phase: snapshot
              comparison: equals
              expected: "true"
            - description: it addresses production capture/restore as the authority for view-state carryover
              target:
                source: jsonPath
                path: $.uiReadmeMentionsCaptureRestore
                phase: snapshot
              comparison: equals
              expected: "true"
            - description: it addresses the jsdom fake canvas and why real-coordinate picking is not representable there
              target:
                source: jsonPath
                path: $.uiReadmeMentionsJsdomCanvas
                phase: snapshot
              comparison: equals
              expected: "true"
            - description: it records the requirement to reacquire the harness handle after a swap
              target:
                source: jsonPath
                path: $.uiReadmeMentionsHandleReacquire
                phase: snapshot
              comparison: equals
              expected: "true"
    - criterionId: E6-18
      disposition: needs-human
      reason: not-safely-automatable
      guidance: "The declared viewer service serves only the real index.html and a valid analysis.json, and the browser surface has no request-interception verb, so none of the three failure kinds can be induced by a probe. Verify in the UI suite with route interception: for unreachable (network failure or 404), malformed (an invalid JSON body) and unsupported version (a document declaring a different major), assert on the exact h1 title and the p detail rendered inside .error-screen. The three titles must be distinct from one another, and each detail must name its specific cause rather than a shared generic sentence."
    - criterionId: E6-19
      disposition: needs-human
      reason: not-safely-automatable
      guidance: "A file: URL is outside the declared service origin, and the browser surface refuses any navigation off that origin by design, so this cannot be probed. Open the built index.html directly from disk in a browser and confirm the protocol-specific screen appears rather than a blank page or a generic load failure, and that its detail gives a concrete way to serve the viewer instead (the command to run, not just the observation that file: does not work)."
    - criterionId: E6-20
      disposition: needs-human
      reason: not-safely-automatable
      guidance: "Inducing a failure whose detail contains markup requires serving a crafted document, which no declared surface can do. In the UI suite, force a loader failure whose detail contains markup such as an image or script tag, then assert BOTH halves: the literal markup text appears in the rendered detail, and querying for an element of that tag inside .error-screen finds nothing. Asserting only the first half would still pass on an innerHTML regression, because the escaped text and the injected element can coexist."
    - criterionId: E6-21
      disposition: needs-human
      reason: not-safely-automatable
      guidance: "Judging whether a written comparison is DERIVED from the current schema and loader is a document-versus-code reading task, and no declared surface can count fields in either. Re-derive the numbers yourself from packages/contract/src/analysis.schema.json and packages/viz/src/loader.ts: required node fields, required edge fields, how many of each the browser loader actually checks, and how deep cochanges validation goes. Then confirm the report states those numbers, and that it explicitly FLAGS any divergence from 12 versus 6, 4 versus 2, and array-only validation rather than quietly printing different figures as if they were expected."
    - criterionId: E6-22
      disposition: needs-human
      reason: not-safely-automatable
      guidance: This needs a document the assembly-time schema validator REJECTS to be served to the browser, and the declared viewer service serves only the real bundle. Verify that the story ships at least one such document, that the assembly-time validator does reject it, that loading it in the browser renders the map rather than an error screen, and that the accompanying report enumerates every schema-required field the browser loader does not check, each classified as 'absence degrades safely' or 'absence is misread'. An unclassified field in that list means the item is not met.
    - criterionId: E6-23
      disposition: automated
      probes:
        - id: validator-gap-report-content
          surface: observation
          mechanics:
            commandId: docs-presence
            args: []
          assertions:
            - description: a validator-gap report exists somewhere in the searched documentation locations
              target:
                source: jsonPath
                path: $.validatorReportPath
                phase: snapshot
              comparison: notEquals
              expected: "null"
            - description: the report states that it describes the gap without changing either validator
              target:
                source: jsonPath
                path: $.validatorReportMentionsNoValidatorChange
                phase: snapshot
              comparison: equals
              expected: "true"
            - description: the report records the open decision for a future alignment, including whether browser validation should widen
              target:
                source: jsonPath
                path: $.validatorReportMentionsFutureAlignment
                phase: snapshot
              comparison: equals
              expected: "true"
        - id: neither-validator-moved
          surface: observation
          mechanics:
            commandId: file-integrity
            args: []
          assertions:
            - description: the browser loader is byte-for-byte the pre-epic file, so the report changed no validator
              target:
                source: jsonPath
                path: $.loaderDigest
                phase: snapshot
              comparison: equals
              expected: a1d2b72addbb703352ab22a207d6934ee6155d41a2991f579d8b16f437365b3c
            - description: the assembly-time schema is byte-for-byte the pre-epic file, so the other validator did not move either
              target:
                source: jsonPath
                path: $.analysisSchemaDigest
                phase: snapshot
              comparison: equals
              expected: 897d6aca49577b131e690cdf8b0a09c4d6f8453b1e0591fff7d7b75d8519fc37
    - criterionId: E6-24
      disposition: needs-human
      reason: not-safely-automatable
      guidance: Deciding this needs measured bounding boxes at two viewport sizes and a click proven to land on the control; the browser surface reports only whether an element is visible, which does not establish that its box lies inside the viewport. In the UI suite, select the node with the longest co-change list, then at 1280x800 and again at roughly 1280x600 read the bounding boxes of the 'show on map' control and of the panel's own action buttons, assert every box is fully inside the viewport (left, top, right, bottom all within bounds), and assert each is clickable through Playwright actionability rather than a synthetic event dispatch.
