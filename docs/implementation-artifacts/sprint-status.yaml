# Sprint status — single source of truth for story lifecycle.
# Keys are task ids (identical to spec filename, branch slug and Refs:
# trailer — one identifier everywhere, deliberately unlike the job-finder
# dual-string convention).
# Statuses: backlog | ready-for-dev | in-progress | review | done
# Editing discipline (agents): flip ONLY your own story's line; on rebase
# conflict keep the union of completed rows from both sides.

development_status:
  # Epic 1 — Contract and Foundations (-> M1)
  1.1-workspace-scaffold: done
  1.2-contract-schema: done
  1.3-contract-fixtures: done
  # The maintainer accepted the perf verdict (3755dcc), which is what this row
  # was waiting for; that acceptance released 2.5 / 3.3 / 3.5.
  1.4-perf-spike: done
  # Epic 2 — Analysis Pipeline and Living Map (-> M2)
  2.1-scanner-core: done
  2.2-deps-ts-imports: done
  2.3-githist-metrics: done
  2.4-cli-pipeline: done
  2.5-viz-engine-core: done
  # Epic 3 — Full Exploration Experience
  3.1-deps-python: done
  3.2-cli-serve-url: done
  3.3-viz-navigation: done
  3.4-viz-panel-modes: done
  3.5-viz-export-perf: done
  # Added 2026-08-13 by the epic/2-scanner-core supervisor, out of supervision
  # rather than planning; must merge before 4.2 turns CI on.
  3.6-fixture-build-race: done
  # 3.7-cli-clone-temp-isolation was specced here on 2026-08-13 and retired the
  # same day without ever being scheduled: story 3.2's author reopened and fixed
  # the flake himself in PR #26. Removed rather than left as a phantom backlog
  # row; the spec and the reasoning are in the history (PR #22).
  # Added 2026-08-13 by the epic/3-deps-python supervisor at epic closure, from
  # the maintainer's own manual pass: search results truncate long paths and
  # carry no title, so the full path cannot be read without opening the result.
  # No AC covers it. Unassigned — the wave is the maintainer's call.
  3.8-viz-search-path-tooltip: done
  # Epic 4 — Ship It (-> M3)
  4.1-build-bundle: done
  # Deferred by the maintainer on 2026-08-13, before the wave launched: GitHub
  # Actions billing is broken on this account, so 4.2's AC-2/AC-3/AC-4 — all of
  # which need a green Actions run and a live Pages deploy — are unrunnable.
  # Not a coverage gap and not an agent failure; it is why DoD item 6 is
  # partial in docs/dod-report.md and why M3 does not fully close with Epic 4.
  4.2-ci-pages-recipe: backlog
  4.3-repo-quality: done
  4.4-dod-validation: done
  # Added 2026-08-13 by the epic/4-build-bundle supervisor, out of supervision
  # rather than planning: nothing in the repo covers publishing, and
  # packages/cli is still private, named @gitnebula/cli and versioned 0.0.0,
  # while the README leads with `npx gitnebula`. Scheduled by the maintainer on
  # 2026-08-14 as the epic's closing wave — one story, one agent, supervised at
  # stage 3 so the supervisor also folds M3's outcome into the Epic 4
  # retrospective (which was written at 4.1-4.4 closure and deliberately left
  # DoD item 1 open pending this story).
  4.5-npm-release: done
  # Added 2026-08-13 by the epic/4-build-bundle supervisor at epic closure, on
  # the maintainer's instruction: 4.1 moved the binary to dist/bin/gitnebula.js
  # and three top-level docs still name the old path, so the one command a
  # visitor can run today fails. Unassigned — the wave is the maintainer's call.
  4.6-docs-path-drift: done
  # Added 2026-08-13 by the epic/4-build-bundle supervisor, from the
  # maintainer's own manual pass on free-proxy: files in a repository's root
  # carry parent: null (story 2.1's deliberate decision) and the Viewer draws
  # only module members, so they never appear — 82% of that repository's lines.
  # No AC covers it. Unassigned — the wave is the maintainer's call.
  4.7-viz-root-files: done

  # Epic 5 — Onboarding-First Map (post-MVP), planned 2026-08-15.
  #
  # Motivated by the maintainer's verdict after a manual pass on langgraph
  # (662 nodes): "a library like this has no real value for a developer".
  # Measured in that pass and quoted in the specs: hover dims 647/650 nodes;
  # pointer hit-areas cover 78% of the viewport at 6x; 232/650 files carry no
  # edge; 386/650 have no history in the 90-day window; the 128 co-change
  # pairs the contract already carries are unused by the UI.
  #
  # ONE branch, `epic/5-onboarding`, unlike Epic 4's three. Wave A merges into
  # it; wave B launches FROM it (AGENT_PR_BASE_BRANCH=epic/5-onboarding) with
  # wave A already in the base — which is what makes 5.6's dependency on 5.5 a
  # base-state fact rather than a cross-wave block. The epic reaches master as
  # a single merge commit after the maintainer's manual verification.
  #
  # Wave A — disjoint territories, all Depends_on []:
  5.1-viz-start-here: done
  5.2-viz-hover-fix: done
  5.3-viz-layer-filter: done
  5.4-viz-drill-down: done
  5.5-viz-history-window: done
  # Wave B — launched after wave A lands on the epic branch:
  5.6-viz-blast-radius: backlog
  5.7-viz-3d-view: backlog
  # 5.8 documents what 5.1-5.7 build, so it is worked and merged last. Its
  # Depends_on is [] because the harness stores exactly one blocking
  # predecessor and seven cannot be declared — the ordering is the
  # supervisor's, exactly as it was for 4.3.
  5.8-repo-docs-refresh: backlog
  # 5.9 was written by the epic-5 supervisor during wave A, with the
  # maintainer's agreement, from a defect no story owned: the cli test command
  # in six specs matches no project and exits 0. Unassigned — the wave it
  # lands in is the maintainer's call. The row exists so that a merged PR for
  # it cannot stop sprint-status.sh with a key the file does not carry.
  5.9-repo-test-command-false-green: done

milestones:
  M1: "Epic 1 merged to master: contract validates, fixtures load, CI green, spike verdict accepted"
  M2: "Epic 2 merged: gitnebula run in the fixture repo emits a valid analysis.json and the viewer renders fixtures"
  M3: "Epic 4 merged: MVP DoD executed and recorded on fastapi, excalidraw, streamlit"
