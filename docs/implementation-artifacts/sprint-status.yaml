# Sprint status — single source of truth for story lifecycle.
# Keys are task ids (identical to spec filename, branch slug and Refs:
# trailer — one identifier everywhere, deliberately unlike the job-finder
# dual-string convention).
# Statuses: backlog | ready-for-dev | in-progress | review | done
# Editing discipline (agents): flip ONLY your own story's line; on rebase
# conflict keep the union of completed rows from both sides.

development_status:
  # Epic 1 — Contract and Foundations (-> M1)
  1.1-workspace-scaffold: done
  1.2-contract-schema: done
  1.3-contract-fixtures: done
  # The maintainer accepted the perf verdict (3755dcc), which is what this row
  # was waiting for; that acceptance released 2.5 / 3.3 / 3.5.
  1.4-perf-spike: done
  # Epic 2 — Analysis Pipeline and Living Map (-> M2)
  2.1-scanner-core: done
  2.2-deps-ts-imports: done
  2.3-githist-metrics: done
  2.4-cli-pipeline: done
  2.5-viz-engine-core: done
  # Epic 3 — Full Exploration Experience
  3.1-deps-python: done
  3.2-cli-serve-url: done
  3.3-viz-navigation: done
  3.4-viz-panel-modes: done
  3.5-viz-export-perf: done
  # Added 2026-08-13 by the epic/2-scanner-core supervisor, out of supervision
  # rather than planning; must merge before 4.2 turns CI on.
  3.6-fixture-build-race: done
  # 3.7-cli-clone-temp-isolation was specced here on 2026-08-13 and retired the
  # same day without ever being scheduled: story 3.2's author reopened and fixed
  # the flake himself in PR #26. Removed rather than left as a phantom backlog
  # row; the spec and the reasoning are in the history (PR #22).
  # Added 2026-08-13 by the epic/3-deps-python supervisor at epic closure, from
  # the maintainer's own manual pass: search results truncate long paths and
  # carry no title, so the full path cannot be read without opening the result.
  # No AC covers it. Unassigned — the wave is the maintainer's call.
  3.8-viz-search-path-tooltip: done
  # Epic 4 — Ship It (-> M3)
  4.1-build-bundle: done
  4.2-ci-pages-recipe: backlog
  4.3-repo-quality: review
  4.4-dod-validation: backlog

milestones:
  M1: "Epic 1 merged to master: contract validates, fixtures load, CI green, spike verdict accepted"
  M2: "Epic 2 merged: gitnebula run in the fixture repo emits a valid analysis.json and the viewer renders fixtures"
  M3: "Epic 4 merged: MVP DoD executed and recorded on fastapi, excalidraw, streamlit"
