  4.7-viz-root-files: done

  # Epic 5 — Onboarding-First Map (post-MVP), planned 2026-08-15.
  #
  # Motivated by the maintainer's verdict after a manual pass on langgraph
  # (662 nodes): "a library like this has no real value for a developer".
  # Measured in that pass and quoted in the specs: hover dims 647/650 nodes;
  # pointer hit-areas cover 78% of the viewport at 6x; 232/650 files carry no
  # edge; 386/650 have no history in the 90-day window; the 128 co-change
  # pairs the contract already carries are unused by the UI.
  #
  # ONE branch, `epic/5-onboarding`, unlike Epic 4's three. Wave A merges into
  # it; wave B launches FROM it (AGENT_PR_BASE_BRANCH=epic/5-onboarding) with
  # wave A already in the base — which is what makes 5.6's dependency on 5.5 a
  # base-state fact rather than a cross-wave block. The epic reaches master as
  # a single merge commit after the maintainer's manual verification.
  #
  # Wave A — disjoint territories, all Depends_on []:
  5.1-viz-start-here: done
  5.2-viz-hover-fix: done
  5.3-viz-layer-filter: done
  5.4-viz-drill-down: done
  5.5-viz-history-window: done
  # Wave B — launched after wave A lands on the epic branch:
  5.6-viz-blast-radius: done
  5.7-viz-3d-view: done
  # 5.8 documents what 5.1-5.7 build, so it is worked and merged last. Its
  # Depends_on is [] because the harness stores exactly one blocking
  # predecessor and seven cannot be declared — the ordering is the
  # supervisor's, exactly as it was for 4.3.
  5.8-repo-docs-refresh: done
  # 5.9 was written by the epic-5 supervisor during wave A, with the
  # maintainer's agreement, from a defect no story owned: the cli test command
  # in six specs matches no project and exits 0. Unassigned — the wave it
  # lands in is the maintainer's call. The row exists so that a merged PR for
  # it cannot stop sprint-status.sh with a key the file does not carry.
  5.9-repo-test-command-false-green: done
  # 5.10 was written by the epic-5 supervisor during wave B, with the
  # maintainer's agreement, from a defect no story owned: a literal NUL byte
  # in packages/viz/src/engine/layout.ts makes our own scanner read the file
  # as binary, so gitnebula's map of gitnebula shows its layout engine at
  # loc 0. Unassigned — the wave it lands in is the maintainer's call. The row
  # exists so that a merged PR for it cannot stop sprint-status.sh with a key
  # the file does not carry.
  5.10-viz-nul-separator: done
  # 5.11 and 5.12 were written by their own agents on 2026-08-16, from defects the
  # maintainer found in his own pass over the running map: start-here ranked by
  # in-degree surfaced barrels rather than the code that explains the repository,
  # and one 40,655-line generated fixture dominated the map and dragged
  # packages/ into layer `test`. Both merged into the epic (PRs #73 and #72), so
  # both read done. Written by hand rather than by measurement because each
  # landed from a branch named for its author's earlier story, which is the one
  # case sprint-status.sh cannot derive.
  5.11-viz-start-here-ranking: done
  5.12-scanner-data-blob: done

  # Epic 6 — The Assembled Viewer, Verified (post-MVP), planned 2026-09-05.
  #
  # Motivated by a gap found while planning: `boot()` — the ~120 lines that
  # fetch the document, render the error screen, mount the chrome, parse
  # `?view=3d` and build the engine — is executed by no test in the
  # repository. Its only caller is `packages/viz/src/main.ts:9`. With it, the
  # real `swapEngine()` and its four ordering constraints are unexercised,
  # guarded only by a hand-maintained duplicate of the carry logic in
  # `app-view-swap.test.ts:50-69`; `renderErrorScreen` has no test in any
  # harness; and two validators guard one document with nothing checking them
  # against each other (schema requires 12 node fields, the loader's predicate
  # checks 6; 4 edge fields against 2; `cochanges` asserted only to be an
  # array).
  #
  # The epic deliberately does NOT re-assert what is already covered. Checked
  # during planning and recorded in `epics.md` so nobody re-derives it: perf
  # and bundle already carry 14 Playwright tests; `engine.pick()` is tested
  # against real geometry; the 2D-3D carry-over has 15 tests; the 3D view is a
  # 2D-canvas projection, so no WebGL path exists; reduced-motion boot is
  # covered twice over; and ~318 jsdom tests already assert the readouts.
  #
  # ONE branch, `epic/6-assembled-viewer`, as epic 5 used. Wave A merges into
  # it; wave B launches FROM it with wave A already in the base — which is why
  # 6.2/6.3/6.4's dependency on 6.1 is a base-state fact rather than a
  # cross-wave block.
  #
  # Wave A — disjoint territories (6.1 owns a new directory, 6.5 owns chrome):
  6.1-viz-ui-suite: done
  6.5-viz-testids-and-debts: done
  # Wave B — launched after wave A lands on the epic branch. All three write
  # new spec files into the directory 6.1 creates; none of them touches
  # packages/viz/src.
  6.2-viz-boot-e2e: done
  6.3-viz-load-failure: done
  6.4-viz-reachability: done
  # Added 2026-09-08 by the epic/6-assembled-viewer supervisor at closure, on
  # the maintainer's instruction. The frozen SpecWitness contract requires
  # `packages/viz/ui/README.md` in criteria E6-06 and E6-17; no story spec ever
  # asked for it, so three of the contract's eleven failures are that one
  # missing file. Unassigned when written.
  6.6-viz-ui-readme: done

milestones:
  M1: "Epic 1 merged to master: contract validates, fixtures load, CI green, spike verdict accepted"
  M2: "Epic 2 merged: gitnebula run in the fixture repo emits a valid analysis.json and the viewer renders fixtures"
  M3: "Epic 4 merged: MVP DoD executed and recorded on fastapi, excalidraw, streamlit"
